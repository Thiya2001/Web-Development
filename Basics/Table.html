<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="./Table.css">
</head>
<body>
    <h1>Create Table</h1>
    <table border="2" cellspacing="0" cellpadding="10">
        <thead>
        <tr>
            <th colspan="6">Points Table</th>
            <!-- <th rowspan="6">Points Table</th> -->
        </tr>
        <tr>
            <th>POS</th>
            <th>Team Name</th>
            <th>Marks</th>
            <th>Win</th>
            <th>Loss</th>
            <th>Points</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1.</td>
            <td>CSK</td>
            <td>6</td>
            <td>6</td>
            <td>0</td>
            <td>12</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>MI</td>
            <td>6</td>
            <td>4</td>
            <td>2</td>
            <td>8</td>
        </tr>
        <tr>
            <td>3.</td>
            <td>KKR</td>
            <td>6</td>
            <td>2</td>
            <td>4</td>
            <td>4</td>
        </tr>
        <tr>
            <td>4.</td>
            <td>RCB</td>
            <td>6</td>
            <td>0</td>
            <td>6</td>
            <td>0</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="5">Total Points</th>
            <th>24</th>
        </tr>
        </tfoot>
    </table>
</body>
</html>
