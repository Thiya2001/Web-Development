<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        img {
            width: 100%;
            height: 80vh;
        }
        #prev {
            color: white;
            top: 35%;
            left: 5%;
            position: absolute;
            font-size: 3em;
        }
        #next {
            color: white;
            position: absolute;
            top: 35%;
            right: 5%;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div>
        <img src="./Images/img1.jpg" alt="img1">
        <h1 id="prev"><</h1>
        <h1 id="next">></h1>
    </div>
    <script src="Carousel.js"></script>
</body>
</html>
