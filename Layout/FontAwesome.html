<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontAwesome</title>
    <link rel="stylesheet" href="..//Layout/FontAwesome.css">
    <link rel="shortcut icon" href="..//Layout/Images/fontawesome.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main>
        <section>
            <div id="smile">
                <h4>WELCOME BACK</h4>
                <i class="fa-solid fa-face-smile" style="color: #ffd33b"></i>
                <h2>Sign In to Your Account</h2>
                <p>Let's get you signed in and straight to the icons.</p>
            </div>
            <div id="info">
                <div class="logo">
                    <label for="">Email Address</label>
                    <input type="email" placeholder="e.g. tchalla@wakanda.gov" title="Please fill out this field."/>
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="logo">
                    <label for="">Password</label>
                    <input type="password" title="Please fill out this field."/>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="btn">
                    <button>Sign In</button>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <div class="footer">
                    <div><input type="checkbox"/><label for="">Remember me</label></div>
                    <div><a href="#">Forgot your password?</a></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
